[package]
name = "coqui-link"
description = "A proven link between two peers, and named streams over it: any protocol, no agent library"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-link"
homepage = "https://boriken-dev.github.io/coqui-link/"
readme = "README.md"
keywords = ["peer", "mux", "streams", "noise", "pairing"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[features]
default = []
# Proving a peer, the session it makes, and pairing by PIN.
sealed = ["dep:coqui-peer", "dep:coqui-builder", "dep:coqui-peer-noise", "dep:coqui-peer-webcrypto"]
# `tcp/1`: a TCP connection per stream.
forward = ["dep:socket2"]

[dependencies]
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false }
serde_json = "1"
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5", optional = true }
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad", optional = true }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681", features = ["pin"], optional = true }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "3a5b30689780a6e6291af565ff6abbaae515973c", features = ["pin"], optional = true }
# Ending a connection with a reset, which std cannot do.
socket2 = { version = "0.6", optional = true }

[dev-dependencies]
proptest = "1"
# The interoperability test talks to the library this one was extracted from.
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "f45938e8cede85a2a2e00afedea1b4944f7c8a67" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# One PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[[test]]
name = "pairing"
required-features = ["sealed"]

[[test]]
name = "interop"
required-features = ["sealed", "forward"]
