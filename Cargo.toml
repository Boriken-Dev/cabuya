[package]
name = "cabuya"
description = "A proven link between two peers, and named streams over it: any protocol, no agent library"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/cabuya"
homepage = "https://boriken-dev.github.io/cabuya/"
readme = "README.md"
keywords = ["peer", "mux", "streams", "noise", "pairing"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[features]
default = []
# Proving a peer, the session it makes, and pairing by PIN.
sealed = ["dep:coqui-peer", "dep:coqui-builder", "dep:coqui-peer-noise", "dep:coqui-peer-webcrypto"]
# `tcp/1`: a TCP connection per stream.
forward = ["dep:socket2", "dep:coqui-net-acl"]
# The `cabuya` program: pairing, serving, connecting and forwarding from a command line.
cli = ["sealed", "forward", "dep:clap"]

[dependencies]
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false }
serde_json = "1"
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f", optional = true }
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad", optional = true }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "d5e8cc4792f7d6e69921822da59ee6e10324cb9a", features = ["pin"], optional = true }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "ed93715e900b68b040db6e8f8dcdf1a60a38b182", features = ["pin"], optional = true }
# Ending a connection with a reset, which std cannot do.
socket2 = { version = "0.6", optional = true }
# Address networks and port ranges, for the targets a `tcp/1` grant may name by pattern.
coqui-net-acl = { git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "839435acc29b76ec0190b7099f870863313d3fcd", optional = true }

# The program's command line, with only what its derive needs.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }

[dev-dependencies]
proptest = "1"
# The interoperability test talks to the library this one was extracted from, at the last revision that still carried the link code
# (its package was then named coqui-agentic-peer, before the repository became agentic-peer). Later revisions of agentic-peer depend on
# this crate for the link, so they cannot stand in: the test would run this crate against itself.
# That revision names older coqui-peer, coqui-peer-noise and coqui-peer-webcrypto revisions of its own, so the dev-dependency graph holds a second
# copy of each. That is expected: it never reaches a consumer, and the test passes peer IDs between the two sides as strings, never as one type.
# `cargo tree -d -e normal,build` must show one coqui-peer and one coqui-peer-webcrypto.
agentic-peer = { package = "coqui-agentic-peer", git = "https://github.com/Boriken-Dev/agentic-peer", rev = "f45938e8cede85a2a2e00afedea1b4944f7c8a67" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# One PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f" }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[[bin]]
name = "cabuya"
path = "src/bin/cabuya/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "pairing"
required-features = ["sealed"]

[[test]]
name = "interop"
required-features = ["sealed", "forward"]

[[test]]
name = "asked"
required-features = ["sealed"]

[[test]]
name = "shared"
required-features = ["sealed"]
